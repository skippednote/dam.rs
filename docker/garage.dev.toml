# Single-node Garage for local development. Not a production layout: one
# replica, no zone redundancy, in-container storage.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

# Dev-only fixed secrets so `mise run up` is reproducible and the bucket/key
# bootstrap in damctl can be idempotent. Real deployments generate these.
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "d0c5b8f4a3e2917c6b5a4938271e0fdc5b4a39281706fedc5b4a39281706fedc5"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "damrs-dev-admin-token"
metrics_token = "damrs-dev-metrics-token"
