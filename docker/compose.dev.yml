# Local development stack. Tests do NOT use this — they spin ephemeral
# containers via testcontainers on random ports so suites can run in parallel
# and never collide with a running dev stack.
#
# Ports are offset well clear of the defaults (5440, not 5432) so this never
# fights a local Postgres or another project's container. 5433 was the first
# choice and was already taken on this machine — hence the wide offset.

name: damrs-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: damrs
      POSTGRES_PASSWORD: damrs
      POSTGRES_DB: damrs
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damrs -d damrs"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SeaweedFS — S3-compatible store, Apache 2.0.
  # https://github.com/seaweedfs/seaweedfs
  #
  # Chosen over Garage after measuring both (DECISIONS.md, D18-revised): one
  # command vs a six-step cluster bootstrap, and credentials can be PINNED in
  # config rather than server-generated and parsed out of CLI output — which is
  # what makes a testcontainers harness reproducible.
  #
  # Supports versioning and object lock (GOVERNANCE/COMPLIANCE + legal holds).
  # Does NOT implement storage-class semantics or RestoreObject: it accepts the
  # header and ignores it, which is worse than rejecting for test purposes. The
  # tiering state machine therefore runs against FakeS3Store (ARCHITECTURE §20.2).
  seaweedfs:
    # Pinned, and pinned to the SAME tag the testcontainers harness uses
    # (crates/dam-store/src/testing.rs): `latest` in dev against a pin in tests is
    # exactly how a capability difference becomes a bug that only reproduces locally.
    # Must be >= 4.3x — versioning and object lock are recent S3-gateway additions.
    image: chrislusf/seaweedfs:4.42
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - ./seaweedfs.s3.json:/etc/seaweedfs/s3.json:ro
      - seaweed-data:/data
    healthcheck:
      # SeaweedFS binds to the container's own IP, not 127.0.0.1, so localhost is
      # refused from inside the container. An unauthenticated GET to the S3 port
      # correctly returns 403, which wget reports as failure — so probe the
      # master's status endpoint on the advertised address instead.
      test: ["CMD-SHELL", "wget -qO- --timeout=3 \"http://$$(hostname -i | cut -d' ' -f1):9333/cluster/status\" >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
  seaweed-data:
