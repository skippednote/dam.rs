[workspace]
resolver = "3"
members = [
    "crates/dam-core",
    "crates/dam-store",
    "crates/dam-db",
    "crates/dam-search",
    "crates/dam-media",
    "crates/dam-ai",
    "crates/dam-connect",
    "crates/dam-api",
    "crates/dam-mcp",
    "bins/damd",
    "bins/dam-worker",
    "bins/damctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/skippednote/damrs"

# Versions verified against crates.io 2026-08-17 (task 0.1). Notable drift from the
# design-time pins: tantivy 0.22 -> 0.26, rmcp 0.8 -> 3.1, sqlx 0.8 -> 0.9,
# winnow 0.7 -> 1.0, opentelemetry 0.27 -> 0.32, testcontainers 0.23 -> 0.28.
# `ort` has no stable release; rc.13 is pinned exactly.
[workspace.dependencies]

# ── async runtime + web ───────────────────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-br", "limit", "timeout"] }
hyper = "1"
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"

# ── database ──────────────────────────────────────────────────────────────────
# `migrate` drives both migrations/global and migrations/tenant (see §5.3).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate",
    "uuid", "chrono", "json", "bigdecimal",
] }
pgvector = { version = "0.4", features = ["sqlx"] }

# ── object storage (D1: S3 only for now) ──────────────────────────────────────
# aws-sdk-s3 rather than `object_store`: we need StorageClass, RestoreObject and
# the x-amz-restore header, all of which object_store abstracts away (D3).
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-smithy-types = "1"

# ── search ────────────────────────────────────────────────────────────────────
tantivy = "0.26"
winnow = "1.0"          # Widen-compatible shorthand query parser -> query IR

# ── media ─────────────────────────────────────────────────────────────────────
# libvips is the primary image path; `image` + fast_image_resize is the fallback
# and the only path used when libvips is unavailable at build time.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "avif"] }
fast_image_resize = { version = "6", features = ["image"] }
libvips = { version = "2" }        # members mark this optional
kamadak-exif = "0.5"
image_hasher = "3.1"      # pHash / dHash for near-duplicate detection
symphonia = { version = "0.6", features = ["all-codecs"] }
pdfium-render = { version = "0.9" }  # members mark this optional
infer = "0.22"          # magic-byte sniffing; never trust client Content-Type

# ── AI ────────────────────────────────────────────────────────────────────────
# ort = ONNX Runtime bindings: SigLIP/CLIP embeddings, OCR, face detect+embed,
# saliency. Pre-1.0 and the API still shifts between rcs — pin exactly.
ort = { version = "2.0.0-rc.13" }      # members mark this optional
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
whisper-rs = { version = "0.16" }      # members mark this optional
# No official Anthropic Rust SDK — dam-ai speaks raw HTTP to /v1/messages.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
eventsource-stream = "0.2"   # SSE for streaming Claude responses

# ── MCP ───────────────────────────────────────────────────────────────────────
rmcp = { version = "3.1", features = ["server", "transport-streamable-http-server"] }

# ── auth ──────────────────────────────────────────────────────────────────────
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
jsonwebtoken = "9"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"            # constant-time comparison for signatures and passcodes

# ── serialization + core types ────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }   # v7 for time-ordered ids
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
blake3 = "1"            # content addressing
base64 = "0.22"
url = { version = "2", features = ["serde"] }
bytes = "1"
mime = "0.3"

# ── observability ─────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = "0.32"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# ── errors, config, CLI, misc ─────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
moka = { version = "0.12", features = ["future"] }
governor = "0.10"        # per-tenant rate limiting
futures = "0.3"
async-trait = "0.1"
itertools = "0.14"
regex = "1"
tempfile = "3"
rand = "0.9"

# ── dev / test (inherited via `dev-dependencies` in members) ──────────────────
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
criterion = "0.5"
wiremock = "0.6"        # stub the Anthropic API in tests
# Every test that touches Postgres or S3 runs against a real container (D17).
# Three S3 backends, none of them optional (ARCHITECTURE §20.2-20.3):
#   Garage      wire protocol — multipart, presign, SigV4, ranged GET
#   SeaweedFS   object lock + versioning, which a fake cannot credibly prove
#   FakeS3Store tiering state machine, needs a controllable clock
# Neither Garage nor SeaweedFS has a testcontainers module; both use GenericImage.
testcontainers = "0.28"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Media and AI workers are CPU-bound; debug builds of image/vips/ort are
# unusably slow, so optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.bench]
lto = "thin"
codegen-units = 1
