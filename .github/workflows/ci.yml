name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just where a lint attribute happens to be set.
  RUSTFLAGS: -D warnings

jobs:
  # Cheap checks first so a formatting slip does not wait behind a container build.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same pinned toolchain the test job and a laptop use, rather than whatever
      # `stable` is on the day. Clippy gains lints in every release, so a floating
      # toolchain means a red `main` produced by a rustc release rather than by a
      # commit — which was the state this job was in the first time it ever ran: the
      # pin says 1.94.0, `stable` was 1.98.0, and `collapsible_match` failed a
      # workspace that was clean locally.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      # mise installs the toolchain with rustup's minimal profile, which carries neither
      # `cargo-fmt` nor `cargo-clippy`. `.mise.toml` names them, and this makes the job
      # independent of whether the runner's mise version honours that key — the version
      # comes from the pin rather than being repeated here, and the command is a no-op
      # once they are present.
      - run: rustup component add --toolchain "$(mise current rust)" rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: mise exec -- cargo fmt --all --check
      - run: mise exec -- cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reclaim the preinstalled toolchains this workspace does not use. Roughly 25GB,
      # against a runner that starts with ~14GB free — and `cargo test --workspace
      # --all-features` needs more than that to link one test binary per integration
      # suite. Cheaper and more honest than trimming the suite to fit the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mise supplies libvips and ffmpeg, pinned in .mise.toml. Without it the media
      # suites fail here while passing locally, because vips lives under
      # ~/.local/share/mise and a bare `cargo test` cannot see it. Installing the
      # same pinned versions CI and laptop alike is the point — an apt libvips would
      # be a different build with a different loader set, which is exactly what
      # `the_loaders_this_build_provides_are_asserted_not_assumed` refuses to guess at.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      # No `services:` block. Every database and object-store test starts its own
      # container through testcontainers (D17), so the suites stay parallel and no
      # test depends on a shared fixture's state. Docker is present on the runner
      # by default, which is all testcontainers needs.
      # A runner has ~14GB free and this workspace does not fit in it: the first run
      # of this job died with `rustc-LLVM ERROR: IO failure on output stream: No
      # space left on device` while linking the last of the test binaries. Full
      # debuginfo for every target in a workspace this size is the bulk of it, and
      # line tables are all a backtrace from a failing test needs.
      - run: mise exec -- cargo test --workspace --all-features
        env:
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          # testcontainers is quiet by default; this surfaces image pulls and wait
          # strategies when a CI-only container failure needs diagnosing.
          RUST_LOG: testcontainers=info

  # The frontend gate. D10 makes WCAG 2.1 AA a release gate "from the first UI commit",
  # so axe runs here from the same commit that introduces the UI rather than being added
  # once violations have accumulated — retrofitting an accessibility gate means fixing a
  # backlog before the gate can go green, which is how gates end up disabled.
  web:
    name: web (typecheck + lint + unit + a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Drift is a build error (§14.1). The Rust suite already asserts openapi.json matches the
      # code; this asserts the checked-in TypeScript client matches openapi.json. Without it a
      # stale client type-checks happily against an out-of-date union and the UI is confidently
      # wrong about what the API can return.
      - run: pnpm run gen:api
      - name: fail if the generated API client is stale
        run: git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm run check
      - run: pnpm run lint
      # Before vitest, not after it. Three of the seven unit files run in Vitest's browser mode
      # and launch Playwright's chromium, so with the install below them the step died on
      # "Executable doesn't exist at .../chromium_headless_shell", having silently run four
      # files out of seven. A laptop never notices: the browser is already in
      # ~/.cache/ms-playwright from some earlier run.
      #
      # Only chromium: the a11y assertions are about the accessibility tree and the DOM, which
      # do not vary by engine. Cross-browser rendering is a separate concern and a separate cost.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # The migrations are the compliance floor (D12-D15). This job applies them to a real
  # Postgres exactly as `damctl migrate` does and asserts the object counts, so a
  # migration that silently drops a constraint fails here rather than in production.
  schema:
    name: schema counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dam-db --test migrate --test compliance_gates -- --nocapture
