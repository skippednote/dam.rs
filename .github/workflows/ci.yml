name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just where a lint attribute happens to be set.
  RUSTFLAGS: -D warnings

jobs:
  # Cheap checks first so a formatting slip does not wait behind a container build.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same pinned toolchain the test job and a laptop use, rather than whatever
      # `stable` is on the day. Clippy gains lints in every release, so a floating
      # toolchain means a red `main` produced by a rustc release rather than by a
      # commit — which was the state this job was in the first time it ever ran: the
      # pin says 1.94.0, `stable` was 1.98.0, and `collapsible_match` failed a
      # workspace that was clean locally.
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      # mise installs the toolchain with rustup's minimal profile, which carries neither
      # `cargo-fmt` nor `cargo-clippy`. `.mise.toml` names them, and this makes the job
      # independent of whether the runner's mise version honours that key — the version
      # comes from the pin rather than being repeated here, and the command is a no-op
      # once they are present.
      - run: rustup component add --toolchain "$(mise current rust)" rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: mise exec -- cargo fmt --all --check
      - run: mise exec -- cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    # Sharded by crate, because the workspace does not fit on a runner in one piece.
    #
    # 150 integration binaries — 57 in `dam-db`, 38 in `dam-api` — and each one statically
    # links the whole graph: sqlx, the aws sdk, tantivy, image. Reclaiming the preinstalled
    # toolchains takes a runner from ~14GB free to 34GB and `cargo test --workspace` still
    # died with `rustc-LLVM ERROR: IO failure on output stream: No space left on device`
    # while linking the last of them, twice. Debuginfo settings alone were not going to
    # close a gap that size.
    #
    # Splitting bounds the disk per shard rather than trimming the suite to fit, and it cuts
    # the wall clock as a side effect. The two big crates get a shard each and everything
    # else shares the third. `fail-fast: false` because one shard's failure must not hide
    # another's — the whole point of running them separately.
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: dam-db
            args: -p dam-db
          - name: dam-api
            args: -p dam-api
          - name: rest
            args: --workspace --exclude dam-db --exclude dam-api
    steps:
      - uses: actions/checkout@v7
      # Roughly 25GB of preinstalled toolchains this workspace never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      # mise supplies the pinned rust, and libvips and ffmpeg with it. Without it the media
      # suites fail here while passing locally, because vips lives under
      # ~/.local/share/mise and a bare `cargo test` cannot see it. Installing the same
      # pinned versions CI and laptop alike is the point — an apt libvips would be a
      # different build with a different loader set, which is exactly what
      # `the_loaders_this_build_provides_are_asserted_not_assumed` refuses to guess at.
      #
      # No `dtolnay/rust-toolchain` beside it: every cargo call here goes through
      # `mise exec`, so a second toolchain would be a gigabyte of disk and an ambiguity
      # about which compiler ran.
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      # No `services:` block. Every database and object-store test starts its own
      # container through testcontainers (D17), so the suites stay parallel and no
      # test depends on a shared fixture's state. Docker is present on the runner
      # by default, which is all testcontainers needs.
      - run: mise exec -- cargo test ${{ matrix.shard.args }} --all-features
        env:
          # Line tables rather than full debuginfo: enough for a backtrace from a failing
          # test to name a file and a line, without carrying type information for every
          # crate into 150 binaries.
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          # testcontainers is quiet by default; this surfaces image pulls and wait
          # strategies when a CI-only container failure needs diagnosing.
          RUST_LOG: testcontainers=info

  # The frontend gate. D10 makes WCAG 2.1 AA a release gate "from the first UI commit",
  # so axe runs here from the same commit that introduces the UI rather than being added
  # once violations have accumulated — retrofitting an accessibility gate means fixing a
  # backlog before the gate can go green, which is how gates end up disabled.
  web:
    name: web (typecheck + lint + unit + a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Drift is a build error (§14.1). The Rust suite already asserts openapi.json matches the
      # code; this asserts the checked-in TypeScript client matches openapi.json. Without it a
      # stale client type-checks happily against an out-of-date union and the UI is confidently
      # wrong about what the API can return.
      - run: pnpm run gen:api
      - name: fail if the generated API client is stale
        run: git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm run check
      - run: pnpm run lint
      # Before vitest, not after it. Three of the seven unit files run in Vitest's browser mode
      # and launch Playwright's chromium, so with the install below them the step died on
      # "Executable doesn't exist at .../chromium_headless_shell", having silently run four
      # files out of seven. A laptop never notices: the browser is already in
      # ~/.cache/ms-playwright from some earlier run.
      #
      # Only chromium: the a11y assertions are about the accessibility tree and the DOM, which
      # do not vary by engine. Cross-browser rendering is a separate concern and a separate cost.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Two implementations of the delivery-token canonical form now exist — the Rust one and the PHP
  # one in the Drupal connector, which signs URLs locally because §11.3 forbids an API call in the
  # render path. They have to agree byte for byte, and a fixture that nothing runs is decoration:
  # without this job a change to `canonical()` would pass CI and break image rendering on every
  # site using the connector, discovered by a customer.
  #
  # Regenerating the vectors is deliberately *not* part of this job. It compares the committed
  # fixture against freshly generated output first, so a Rust-side format change fails here with a
  # diff instead of quietly rewriting the file it is supposed to be checked against.
  drupal:
    name: drupal connector (signing parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: fail if the committed fixtures are stale
        run: |
          cargo run -q -p dam-core --example signing_vectors > /tmp/vectors.json
          diff -u integrations/drupal/tests/fixtures/signing_vectors.json /tmp/vectors.json \
            || { echo "::error::the delivery-token format changed; regenerate the vectors and update the PHP signer"; exit 1; }
          cargo run -q -p dam-media --example transform_names > /tmp/transforms.json
          diff -u integrations/drupal/tests/fixtures/transform_names.json /tmp/transforms.json \
            || { echo "::error::the transform names changed; regenerate the fixture and update Transforms.php"; exit 1; }
          cargo run -q -p dam-connect --example webhook_vectors > /tmp/webhooks.json
          diff -u integrations/drupal/tests/fixtures/webhook_vectors.json /tmp/webhooks.json \
            || { echo "::error::the webhook signature scheme changed; regenerate the fixture and update WebhookSignature.php"; exit 1; }
      # The phar rather than `composer install`, because the module requires drupal/core and pulling it
      # in to assert a byte comparison would make the job guarding the wire format the slowest in CI.
      # The signer needs nothing from Drupal, which is the whole reason it can run in the render path.
      - name: phpunit
        working-directory: integrations/drupal
        run: |
          curl -sSLo phpunit.phar https://phar.phpunit.de/phpunit-11.phar
          php phpunit.phar --configuration phpunit.xml.dist --colors=never

  # The signing job above needs no Drupal, which is why it is fast. This one does:
  # the property it guards — that a damrs outage cannot blank metadata a previous
  # sync cached — lives in how `Media::preSave()` calls the source plugin, so it
  # is only observable with a real entity system behind it. A plugin can be
  # perfectly correct in isolation and still lose data through how Drupal calls
  # it.
  #
  # Also runs Drupal's own coding standards. §11.2 calls for a contrib-shaped
  # package, and a module failing `phpcs --standard=Drupal` is not one.
  drupal-kernel:
    name: drupal connector (kernel + standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          tools: composer
      - name: build a throwaway Drupal site
        run: |
          composer create-project drupal/recommended-project site --no-interaction --no-progress
          cd site
          composer config --no-plugins allow-plugins true
          composer require --dev drupal/core-dev --with-all-dependencies --no-interaction --no-progress
      - name: install the module into it
        run: |
          mkdir -p site/web/modules/custom
          cp -R integrations/drupal site/web/modules/custom/damrs
      - name: drupal coding standards
        working-directory: site
        run: |
          ./vendor/bin/phpcs --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install,test,info,yml \
            web/modules/custom/damrs
      - name: kernel tests
        working-directory: site
        run: |
          mkdir -p web/sites/default/files
          cp web/modules/custom/damrs/tests/phpunit-kernel.xml.dist phpunit-kernel.xml
          ./vendor/bin/phpunit -c phpunit-kernel.xml

  # The migrations are the compliance floor (D12-D15). This job applies them to a real
  # Postgres exactly as `damctl migrate` does and asserts the object counts, so a
  # migration that silently drops a constraint fails here rather than in production.
  schema:
    name: schema counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dam-db --test migrate --test compliance_gates -- --nocapture
