[package]
name = "damctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-api = { path = "../../crates/dam-api" }
dam-core = { path = "../../crates/dam-core" }
dam-telemetry = { path = "../../crates/dam-telemetry" }
dam-db = { path = "../../crates/dam-db" }
dam-store = { path = "../../crates/dam-store" }
dam-backup = { path = "../../crates/dam-backup" }
dam-search = { path = "../../crates/dam-search" }
# A crosswalk is reviewed as a JSON file and stored as jsonb; the import records arrive as JSON lines.
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
figment = { workspace = true }
clap = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
