[tools]
rust = "1.94.0"          # edition 2024 needs >= 1.85; pinned to what's installed
node = "24"              # for the Svelte app in web/
pnpm = "10"

[env]
# Points sqlx's compile-time macros at the migrated template schema so
# query! can resolve tenant tables. See ARCHITECTURE.md §5.5.
DATABASE_URL = "postgres://damrs:damrs@localhost:5440/damrs?options=-c%20search_path%3Dtenant_template,extensions,public"
SQLX_OFFLINE = "true"    # CI and normal builds use .sqlx/; unset to regenerate
RUST_LOG = "damrs=debug,sqlx=warn,tower_http=debug"

# Local dev stack (docker/compose.dev.yml). Tests use testcontainers on random
# ports instead and ignore these.
#
# The `__` is the section separator (figment `Env::prefixed("DAMRS_").split("__")`),
# and the config denies unknown fields — so `DAMRS_S3_BUCKET` is not a loose
# alias for `storage.bucket`, it is a hard startup failure. Every name here must
# match a real field in dam_core::config.
DAMRS_STORAGE__ENDPOINT = "http://localhost:8333"
DAMRS_STORAGE__REGION = "us-east-1"
DAMRS_STORAGE__BUCKET = "damrs-dev"
DAMRS_STORAGE__FORCE_PATH_STYLE = "true"
DAMRS_STORAGE__ACCESS_KEY_ID = "damrsdev"
DAMRS_STORAGE__SECRET_ACCESS_KEY = "damrsdevsecret"
# Also exported unprefixed for the aws CLI, which the compose stack's healthcheck
# and any manual `aws s3 ls` against the dev endpoint use.
AWS_ACCESS_KEY_ID = "damrsdev"
AWS_SECRET_ACCESS_KEY = "damrsdevsecret"

[tasks.openapi]
description = "Regenerate openapi.json and the TypeScript client from it"
run = """
cargo run -q -p damctl -- openapi --write
cd web && pnpm exec openapi-typescript ../openapi.json -o src/lib/api/schema.d.ts
"""

[tasks."check:web"]
description = "Frontend gate: typecheck, lint, unit tests, and the axe a11y suite"
dir = "web"
run = """
pnpm install --frozen-lockfile
pnpm run check
pnpm run lint
pnpm exec vitest run
pnpm exec playwright test
"""

# Deliberately not folded into `check`: the Rust gate runs on every edit and adding a
# browser install plus a Vite build to it would make the inner loop minutes long. CI runs
# both, and `check:all` is here for a pre-push sweep.
[tasks."check:all"]
description = "Everything CI runs"
depends = ["check", "check:web"]

[tasks.up]
description = "Start local Postgres + SeaweedFS"
run = "docker compose -f docker/compose.dev.yml up -d --wait"

[tasks.down]
description = "Stop local dev stack"
run = "docker compose -f docker/compose.dev.yml down -v"

[tasks.migrate]
description = "Apply global + tenant migrations to the local stack"
run = "cargo run -q -p damctl -- migrate --all"

[tasks.check]
description = "The bar: fmt, clippy, test"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo test --all-features",
]
