[package]
name = "dam-ai"
description = "Local inference (ONNX), hosted-model clients, enrichment DAG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-db = { path = "../dam-db" }
dam-store = { path = "../dam-store" }
thiserror = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
ndarray = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true

[features]
# The recorded transport, behind a feature so other crates' tests can drive a model without a key or a network,
# and so it cannot reach a production build.
testing = []

[dev-dependencies]
# The crate depends on itself with `testing` on, which is how an integration test reaches a module that a
# production build must not contain. `#[cfg(test)]` alone would not do it: an integration test links the library
# as an ordinary dependency, built without the `test` cfg.
dam-ai = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
