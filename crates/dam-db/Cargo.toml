[package]
name = "dam-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
thiserror = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# The container harness ships behind a feature so other crates' dev-dependencies
# can reuse it (`dam-db = { path = "...", features = ["testing"] }`) without
# testcontainers landing in a production build.
testcontainers = { workspace = true, optional = true }

[features]
testing = ["dep:testcontainers"]

[dev-dependencies]
dam-db = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
