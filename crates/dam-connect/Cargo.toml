[package]
name = "dam-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-db = { path = "../dam-db" }
thiserror = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# A real receiver to deliver to. The signature scheme and the retry policy are only worth anything if they
# survive an actual HTTP round trip — a mocked client would test the code's opinion of itself.
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
