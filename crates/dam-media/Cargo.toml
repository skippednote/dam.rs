[package]
name = "dam-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-store = { path = "../dam-store" }
thiserror = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
kamadak-exif = { workspace = true }
image_hasher = { workspace = true }
infer = { workspace = true }
uuid = { workspace = true }
symphonia = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "macros"] }
tracing = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
# The SeaweedFS harness: finalising is validated against a real server, since the ranged
# reads it relies on are exactly what a fake would get wrong for free.
dam-store = { path = "../dam-store", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
