[package]
name = "dam-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-db = { path = "../dam-db" }
dam-store = { path = "../dam-store" }
dam-media = { path = "../dam-media" }
dam-pipeline = { path = "../dam-pipeline" }
dam-search = { path = "../dam-search" }
dam-connect = { path = "../dam-connect" }
thiserror = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
governor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

blake3 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
dam-db = { path = "../dam-db", features = ["testing"] }
dam-store = { path = "../dam-store" }
# The search router needs an index directory, and a category query is only interesting if `/search` answers it.
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
