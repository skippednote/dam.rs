[package]
name = "dam-pipeline"
description = "The ingest pipeline: what turns an upload into an asset, and an asset into its derivatives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-connect = { path = "../dam-connect" }
dam-db = { path = "../dam-db" }
dam-store = { path = "../dam-store" }
dam-media = { path = "../dam-media" }
dam-search = { path = "../dam-search" }
dam-ai = { path = "../dam-ai" }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tempfile = { workspace = true }
tantivy = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
dam-db = { path = "../dam-db", features = ["testing"] }
dam-media = { path = "../dam-media", features = ["testing"] }
dam-store = { path = "../dam-store", features = ["testing"] }
# The recorded transport, so the enrichment stage can be driven end to end without a key or a network.
dam-ai = { path = "../dam-ai", features = ["testing"] }
image = { workspace = true }
blake3 = { workspace = true }

# Not `workspace = true`, and the difference is one line: `expect_used` is **denied** here rather
# than warned. Cargo has no partial override — a manifest either inherits the whole table or states
# its own — so this is the whole policy repeated to change one entry.
#
# Worth the duplication. This crate is the worker: every stage runs unattended against somebody
# else's data, and an `expect` that fires takes down a process no user is watching, with a panic
# message where a retry or a dead-lettered job belonged. The API can afford a considered `expect` on
# a startup path a human is watching. A background worker cannot.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
