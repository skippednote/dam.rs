[package]
name = "dam-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-db = { path = "../dam-db" }
dam-store = { path = "../dam-store" }
dam-media = { path = "../dam-media" }
dam-search = { path = "../dam-search" }
dam-ai = { path = "../dam-ai" }
anyhow = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tempfile = { workspace = true }
tantivy = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
dam-db = { path = "../dam-db", features = ["testing"] }
dam-media = { path = "../dam-media", features = ["testing"] }
dam-store = { path = "../dam-store", features = ["testing"] }
# The recorded transport, so the enrichment stage can be driven end to end without a key or a network.
dam-ai = { path = "../dam-ai", features = ["testing"] }
image = { workspace = true }
blake3 = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
