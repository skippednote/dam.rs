[package]
name = "dam-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dam-core = { path = "../dam-core" }
dam-db = { path = "../dam-db" }
dam-search = { path = "../dam-search" }
# The REST layer, on purpose: §8.5 says the MCP server runs over the *same* ABAC layer, and the strongest form
# of that is calling the same functions the HTTP routes call rather than reimplementing them.
dam-api = { path = "../dam-api" }
thiserror = { workspace = true }
rmcp = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
dam-db = { path = "../dam-db", features = ["testing"] }
dam-store = { path = "../dam-store", features = ["testing"] }
blake3 = { workspace = true }
tower = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "warn"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
